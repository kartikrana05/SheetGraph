# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yml-json-schema.json
#yamlPreprocessor=on
#
# Provisions the whole SheetGraph project in one command:
#   zcli project project-import zerops-project-import.yaml
#
# The preprocessor line above is required for <@generateRandomString(...)>
# to expand — without it the literal string is stored as the password.

project:
  name: sheetgraph
  description: Turn any spreadsheet into a queryable Neo4j knowledge graph
  corePackage: LIGHT
  tags:
    - hackathon
    - zerops-challenge
  envVariables:
    # ── Database connection ──────────────────────────────────
    # Defaults point at the in-project `graph` Docker service. To fall back to
    # a managed Neo4j Aura instance, change these four here and redeploy `api`
    # — no code change, because the app reads all of them from the environment.
    #
    #   NEO4J_URI:      neo4j+s://<instance>.databases.neo4j.io
    #   NEO4J_USER:     <instance id>      (Aura's snippet calls it USERNAME)
    #   NEO4J_PASSWORD: <generated>
    #   NEO4J_DATABASE: <instance id>      (leave empty for self-hosted)
    NEO4J_URI: bolt://graph:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: <@generateRandomString(<24>)>
    NEO4J_DATABASE: ""

    # Set this AFTER the first deploy, to the api service's public subdomain
    # (e.g. https://api-1a2b-8000.prg1.zerops.app), then redeploy `web`.
    API_URL: ""

services:
  # ─── Neo4j in a Docker service (a VM) ───────────────────
  # Created first so the api has something to connect to on boot.
  - hostname: graph
    type: docker@26.1.5
    priority: 10
    # buildFromGit does a one-time build straight from a PUBLIC repo, so
    # importing this file provisions AND deploys in a single step — no zcli
    # push needed. The URL must have no trailing .git suffix.
    buildFromGit: https://github.com/kartikrana05/SheetGraph
    minContainers: 1
    maxContainers: 1
    # Docker services need fixed resources — a VM cannot be resized without
    # a restart, so min and max are set equal to disable autoscaling.
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 1
      startCpuCoreCount: 1
      minRam: 2
      maxRam: 2
      minDisk: 10
      maxDisk: 10
    # The Neo4j Browser on :7474 is useful for judging and debugging.
    # Bolt on :7687 stays private — sibling services reach it at graph:7687.
    enableSubdomainAccess: true

  # ─── FastAPI backend ────────────────────────────────────
  - hostname: api
    type: python@3.12
    priority: 5
    buildFromGit: https://github.com/kartikrana05/SheetGraph
    enableSubdomainAccess: true
    minContainers: 1
    # In-memory staging of a parsed sheet between upload and apply means a
    # single container. Moving that to object storage would lift this cap.
    maxContainers: 1
    verticalAutoscaling:
      minRam: 0.5
      maxRam: 2
    envSecrets:
      # Replace in the Zerops GUI (Service → Environment variables) or via
      # `zcli`. Kept out of the repo deliberately.
      GROQ_API_KEY: ""

  # ─── React SPA ──────────────────────────────────────────
  - hostname: web
    type: static
    priority: 1
    buildFromGit: https://github.com/kartikrana05/SheetGraph
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.25
      maxRam: 1
